[package]
name = "serial-helper"
version = "0.3.2"
description = "Serial port monitor and firmware flashing tool"
authors = ["Serial Helper Team"]
edition = "2021"

[lib]
name = "serial_helper_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt", "time"] }
thiserror = "1"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
hex = "0.4"
sha2 = "0.10"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[package.metadata]
# Tauri configuration metadata
