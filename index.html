<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serial Helper</title>
    <script>
      // Runs before anything paints, so the first frame already has the right
      // theme and size. Mirrors settingsStore.applyTheme / applyUiScale.
      (function () {
        var s = {};
        try {
          s = JSON.parse(localStorage.getItem("serial-helper-settings") || localStorage.getItem("serialhelper-settings") || "{}");
        } catch (e) {}
        var theme = s.theme || "system";
        var dark = theme === "dark" || (theme === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.fontSize = (s.uiScale || 14) + "px";
        root.style.background = dark ? "#0e1d19" : "#eceeea";
        if (s.showSplash === false) root.classList.add("no-splash");
        window.__splashName = (s.language || "zh-CN") === "zh-CN" ? "串口助手" : "Serial Helper";
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #eceeea;
        color: #4a5752;
        font: 600 15px "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
        transition: opacity 180ms ease-out;
        -webkit-user-select: none;
        user-select: none;
      }
      .dark #splash { background: #0e1d19; color: #a9b8b1; }
      #splash svg { --accent: #1e6b58; --ink: #18221f; }
      .dark #splash svg { --accent: #d2a447; --ink: #e6ece4; }
      .no-splash #splash { display: none; }
      #splash svg, #splash span { opacity: 0; transform: translateY(4px); transition: opacity 260ms ease-out, transform 260ms ease-out; }
      #splash span { transition-delay: 120ms; }
      #splash path { stroke-dasharray: 22; stroke-dashoffset: 22; }
      /* .play is added when the window becomes visible, so the animation is never spent off screen. */
      #splash.play svg, #splash.play span { opacity: 1; transform: none; }
      #splash.play path { animation: splash-trace 650ms 120ms ease-in-out forwards; }
      #splash.done { opacity: 0; pointer-events: none; transition-duration: 220ms; }
      @keyframes splash-trace { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { transition: none !important; animation: none !important; }
        #splash path { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="3" width="16" height="16" rx="3" stroke="var(--accent)" stroke-width="1.4" />
        <path d="M7 11h2.5l1.5-3 2 6 1.5-3H15" stroke="var(--ink)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span id="splash-name">Serial Helper</span>
    </div>
    <script>document.getElementById("splash-name").textContent = window.__splashName;</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
